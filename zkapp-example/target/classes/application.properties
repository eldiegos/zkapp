spring.application.name=zkapp-example

zkapp.application.name=ZKApp Demo
zkapp.application.code=DEMO
zkapp.ui.home-page=/index.zul
zkapp.ui.title=ZKApp - Aplicacion de demostracion

# El proveedor de autenticacion real es LDAP, pero esta aplicacion de ejemplo sustituye el
# AuthenticationProvider por unos usuarios en memoria (vease DemoSecurityConfiguration) para poder
# ejecutarse sin un servidor LDAP real. Una aplicacion real apuntaria estas propiedades a su
# directorio corporativo y eliminaria DemoSecurityConfiguration.
zkapp.security.authentication.provider=ldap
zkapp.security.ldap.enabled=true
zkapp.security.ldap.url=ldap://localhost:389
zkapp.security.ldap.base=dc=example,dc=com
zkapp.security.ldap.user-search-base=ou=people
zkapp.security.ldap.user-search-filter=(uid={0})

zkapp.session.timeout=30m
zkapp.audit.enabled=true

server.servlet.context-path=/
